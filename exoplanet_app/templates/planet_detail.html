{% extends "base.html" %}

{% block title %}Exoplanet Explorer | Catalog{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <p class="eyebrow">Planet Explorer</p>
    <h1>Search and compare the known exoplanet population.</h1>
  </div>
</section>

<section class="filters panel">
  <div class="filter-grid">
    <label>
      Search
      <input id="search-input" type="text" placeholder="Planet or host star" />
    </label>
    <label>
      Discovery method
      <select id="method-filter">
        <option value="">Any</option>
      </select>
    </label>
    <label>
      Radius min (Rj)
      <input id="radius-min" type="number" step="0.01" placeholder="0" />
    </label>
    <label>
      Radius max (Rj)
      <input id="radius-max" type="number" step="0.01" placeholder="2" />
    </label>
    <label>
      Mass min (Mj)
      <input id="mass-min" type="number" step="0.01" placeholder="0" />
    </label>
    <label>
      Mass max (Mj)
      <input id="mass-max" type="number" step="0.01" placeholder="5" />
    </label>
    <label>
      Year min
      <input id="year-min" type="number" step="1" placeholder="1995" />
    </label>
    <label>
      Year max
      <input id="year-max" type="number" step="1" placeholder="2025" />
    </label>
  </div>
  <div class="button-row">
    <button id="apply-filters" class="primary-btn">Apply filters</button>
    <button id="reset-filters" class="ghost-btn">Reset</button>
  </div>
</section>

<section class="panel">
  <div id="results-meta" class="results-meta">Loading catalog...</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Planet</th>
          <th>Host star</th>
          <th>Method</th>
          <th>Year</th>
          <th>Period (d)</th>
          <th>Radius (Rj)</th>
          <th>Mass (Mj)</th>
          <th>Teq (K)</th>
        </tr>
      </thead>
      <tbody id="planet-table-body"></tbody>
    </table>
  </div>
  <div class="pager">
    <button id="prev-page" class="ghost-btn">Previous</button>
    <span id="page-indicator">Page 1</span>
    <button id="next-page" class="ghost-btn">Next</button>
  </div>
</section>

<script src="/static/js/app.js"></script>
{% endblock %}
